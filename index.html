*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a1520}
.slider{width:100%;height:100%;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.page{width:100%;height:100%;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;background:#0a1520}

#bg2{object-position:22% 48%}

#btn-to-page2{bottom:max(20px,env(safe-area-inset-bottom))}
#btn-to-page1{top:max(20px,env(safe-area-inset-top))}
.dots{position:fixed;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:40}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);transition:all .25s}
.dot.active{background:#25D366;transform:scale(1.35);box-shadow:0 0 10px rgba(37,211,102,.7)}

<script>
const slider=document.getElementById('slider');

function goToPage(i){slider.scrollTo({top:i*window.innerHeight,behavior:'smooth'})}
